<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Versetile Bass - Experience the Sound</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-color: #1f2833;
            --accent-color: #00ffcc;
            --text-color: #ffffff;
            --text-secondary: #c5c6c7;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        header { text-align: center; margin: 20px 0 40px; }
        header h1 { font-size: 2.5rem; letter-spacing: 2px; color: var(--text-color); }
        header h1 span { color: var(--accent-color); }
        header p { color: var(--text-secondary); margin-top: 5px; font-size: 0.9rem; }
        .player-container { background: var(--card-color); border-radius: 20px; width: 100%; max-width: 380px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; border: 1px solid rgba(0, 255, 204, 0.1); }
        .album-art { width: 100%; aspect-ratio: 1; background: linear-gradient(135deg, #1f2833, #00ffcc22); border-radius: 15px; margin-bottom: 25px; display: flex; align-items: center; justify-content: center; font-size: 5rem; position: relative; overflow: hidden; border: 2px solid rgba(255,255,255,0.05); }
        .album-art::after { content: '🎵'; }
        .track-details h2 { font-size: 1.4rem; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-details p { color: var(--accent-color); font-weight: 600; font-size: 0.9rem; margin-bottom: 25px; }
        .progress-area { margin-bottom: 25px; }
        .progress-bar { width: 100%; -webkit-appearance: none; background: #45a29e; height: 6px; border-radius: 5px; outline: none; }
        .progress-bar::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent-color); cursor: pointer; box-shadow: 0 0 8px var(--accent-color); }
        .time-box { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-secondary); margin-top: 8px; }
        .controls { display: flex; justify-content: center; align-items: center; gap: 25px; margin-bottom: 20px; }
        .btn { background: none; border: none; color: var(--text-color); font-size: 1.5rem; cursor: pointer; transition: 0.2s; }
        .btn:hover { color: var(--accent-color); }
        .btn-play { background: var(--accent-color); color: var(--bg-color); width: 60px; height: 60px; border-radius: 50%; font-size: 1.8rem; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px rgba(0, 255, 204, 0.4); }
        .btn-play:hover { transform: scale(1.05); color: var(--bg-color); }
        .badge { display: inline-block; background: rgba(0, 255, 204, 0.1); color: var(--accent-color); padding: 5px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; margin-top: 20px; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

    <header>
        <h1>Versetile<span>Bass</span></h1>
        <p>South African Music Culture • Experience the Sound</p>
    </header>

    <div class="player-container">
        <div class="album-art"></div>
        
        <div class="track-details">
            <h2 id="title">Amanyala Block</h2>
            <p id="artist">Lucky Versetile</p>
        </div>

        <div class="progress-area">
            <input type="range" class="progress-bar" id="progress" value="0" min="0" max="100">
            <div class="time-box">
                <span id="current-time">0:00</span>
                <span id="duration">3:45</span>
            </div>
        </div>

        <div class="controls">
            <button class="btn">⏮</button>
            <button class="btn btn-play" id="play-btn">▶</button>
            <button class="btn">⏭</button>
        </div>

        <span class="badge">Amapiano / Bass Boosted</span>
    </div>

    <audio id="audio-engine" src=""></audio>

    <script>
        const audio = document.getElementById('audio-engine');
        const playBtn = document.getElementById('play-btn');
        const progress = document.getElementById('progress');
        const currentTimeEl = document.getElementById('current-time');
        let isPlaying = false;

        function togglePlay() {
            if (isPlaying) {
                playBtn.innerText = '▶';
                isPlaying = false;
            } else {
                playBtn.innerText = '⏸';
                isPlaying = true;
                alert("Versetile Bass Engine Online! Add your audio files to Phase 2 to stream your music live.");
            }
        }
        playBtn.addEventListener('click', togglePlay);
    </script>
</body>
</html>
